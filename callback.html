
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>ShortsStudio | Authorization</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0b1220;
            color: #f1f5f9;
            font-family: system-ui, sans-serif;
        }
        main {
            width: min(460px, 92vw);
            padding: 40px;
            background: #172132;
            border: 1px solid #334155;
            border-radius: 20px;
            text-align: center;
        }
        img { width: 90px; border-radius: 18px; }
        h1 { color: #38bdf8; }
        p { color: #94a3b8; line-height: 1.6; }
        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #38bdf8;
            color: #0b1220;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled {
            opacity: .5;
            cursor: default;
        }
    </style>
</head>
<body>
    <main>
        <img src="logo.png" alt="ShortsStudio">
        <h1>ShortsStudio</h1>
        <h2 id="status">Checking authorization...</h2>
        <p id="message"></p>
        <button id="continue" hidden>
            Return to ShortsStudio
        </button>
    </main>

    <script>
        const params = new URLSearchParams(location.search);
        const code = params.get("code");
        const state = params.get("state");
        const error = params.get("error");

        history.replaceState(null, "", location.pathname);

        const status = document.getElementById("status");
        const message = document.getElementById("message");
        const button = document.getElementById("continue");

        if (error || !code || !state) {
            status.textContent = "Authorization unsuccessful";
            message.textContent =
                "Return to ShortsStudio and try connecting again.";
        } else {
            status.textContent = "Authorization received";
            message.textContent =
                "Continue to your local ShortsStudio application.";

            button.hidden = false;

            button.addEventListener("click", () => {
                const callback = new URL(
                    "http://127.0.0.1:3456/callback/"
                );

                callback.searchParams.set("code", code);
                callback.searchParams.set("state", state);

                location.replace(callback.toString());
            });
        }
    </script>
</body>
</html>
